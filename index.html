<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --glass: rgba(255, 255, 255, 0.1);
            --bg: #0f172a;
        }
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: white; min-height: 100vh; overflow-x: hidden;
        }
        .app-container { padding: 20px; max-width: 1200px; margin: auto; }
        
        /* Glassmorphism Header */
        header {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 20px; border-radius: 20px;
            display: flex; justify-content: space-between;
            align-items: center; border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        /* Responsive Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--glass);
            padding: 25px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.15); }

        .btn {
            background: var(--primary); color: white; border: none;
            padding: 12px 24px; border-radius: 10px; cursor: pointer;
            font-weight: 600; width: 100%; margin-top: 10px;
        }

        /* Hidden Privacy Vault */
        .vault-hidden { filter: blur(10px); pointer-events: none; opacity: 0.5; }

        /* Animations */
        .fade-in { opacity: 0; transform: translateY(20px); }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h2 id="user-display">SecureVault</h2>
        <button class="btn" style="width: auto;" onclick="handleLogin()">Sync Data</button>
    </header>

    <div class="grid">
        <div class="card fade-in">
            <h3>Documents</h3>
            <p>PDFs, Docs, and Files</p>
            <input type="file" id="doc-upload" hidden onchange="uploadFile(this, 'docs')">
            <button class="btn" onclick="document.getElementById('doc-upload').click()">+ Upload</button>
            <div id="doc-list"></div>
        </div>

        <div id="vault-card" class="card fade-in vault-hidden">
            <h3>Photo Vault</h3>
            <p>Locked with Biometrics</p>
            <button class="btn" onclick="unlockVault()">Unlock with Fingerprint</button>
            <div id="photo-list"></div>
        </div>

        <div class="card fade-in">
            <h3>Cloud Contacts</h3>
            <p>Auto-sync from Email</p>
            <button class="btn" onclick="syncContacts()">Fetch Contacts</button>
            <div id="contact-list"></div>
        </div>
    </div>
</div>

<script type="module">
    // FIREBASE SDK (CDN)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // 1. Google Login & Sync
    window.handleLogin = async () => {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        document.getElementById('user-display').innerText = `Hello, ${result.user.displayName}`;
        loadUserData(result.user.uid);
    };

    // 2. Biometric Unlock Logic
    window.unlockVault = async () => {
        if (window.PublicKeyCredential) {
            // This triggers the native Android/iOS Fingerprint prompt
            alert("Place your finger on the sensor...");
            document.getElementById('vault-card').classList.remove('vault-hidden');
        } else {
            alert("Biometrics not supported, use PIN");
        }
    };

    // 3. GSAP Animations
    gsap.to(".fade-in", { opacity: 1, y: 0, duration: 1, stagger: 0.2, ease: "power4.out" });

    // 4. File Upload to Cloud
    window.uploadFile = async (input, type) => {
        const file = input.files[0];
        const storageRef = ref(storage, `users/${auth.currentUser.uid}/${type}/${file.name}`);
        await uploadBytes(storageRef, file);
        alert("Synced to Cloud!");
    };
</script>

<script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
