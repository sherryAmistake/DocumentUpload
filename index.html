<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault 15GB</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root { --primary: #4285f4; --bg: #0f172a; --card: rgba(255, 255, 255, 0.05); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        .app-container { max-width: 500px; margin: auto; padding: 20px; min-height: 100vh; }
        
        /* Glassmorphism Design */
        .glass-card { 
            background: var(--card); backdrop-filter: blur(12px); 
            border-radius: 24px; padding: 25px; border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px; transition: transform 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); }

        .btn { 
            background: var(--primary); color: white; border: none; padding: 15px; 
            border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
        }
        
        #app-content { display: none; }
        .file-item { 
            background: rgba(255,255,255,0.03); padding: 12px; 
            border-radius: 10px; margin-top: 8px; display: flex; justify-content: space-between;
        }
        .vault-hidden { filter: blur(15px); pointer-events: none; }
        .status-pill { font-size: 11px; background: #10b981; padding: 2px 8px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="login-screen" class="glass-card" style="margin-top: 100px; text-align: center;">
        <h1>CloudVault <span style="color:var(--primary)">Pro</span></h1>
        <p style="color: #94a3b8;">Securely sync 15GB of documents using your Google Drive.</p>
        <button class="btn" onclick="handleAuthClick()">Login with Google</button>
    </div>

    <div id="app-content">
        <div class="glass-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>My Documents</h3>
                <span class="status-pill">15GB Free</span>
            </div>
            <input type="file" id="filePicker" hidden onchange="uploadFile()">
            <button class="btn" onclick="document.getElementById('filePicker').click()">+ Upload Document</button>
            <div id="file-list" style="margin-top: 15px;"></div>
        </div>

        <div class="glass-card">
            <h3>🔒 Photo Vault</h3>
            <div id="vault-area" class="vault-hidden">
                <p>Private photos synced across devices.</p>
            </div>
            <button id="biometric-btn" class="btn" style="background:#475569;" onclick="unlockVault()">Unlock Fingerprint</button>
        </div>
    </div>
</div>

<script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
<script src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>

<script>
    // --- CONFIGURATION (Get these from Google Cloud Console) ---
    const CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';
    const API_KEY = 'YOUR_API_KEY';
    const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";
    const SCOPES = "https://www.googleapis.com/auth/drive.file";

    let tokenClient;
    function gapiLoaded() { gapi.load('client', () => gapi.client.init({apiKey: API_KEY, discoveryDocs: [DISCOVERY_DOC]})); }
    function gisLoaded() { tokenClient = google.accounts.oauth2.initTokenClient({client_id: CLIENT_ID, scope: SCOPES, callback: ''}); }

    function handleAuthClick() {
        tokenClient.callback = async (resp) => {
            gsap.to("#login-screen", { opacity: 0, y: -50, duration: 0.5, onComplete: () => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                gsap.from("#app-content", { opacity: 0, y: 50 });
                listFiles();
            }});
        };
        tokenClient.requestAccessToken({prompt: 'consent'});
    }

    async function uploadFile() {
        const file = document.getElementById('filePicker').files[0];
        const metadata = { 'name': file.name, 'mimeType': file.type };
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', file);

        await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: new Headers({ 'Authorization': 'Bearer ' + gapi.auth.getToken().access_token }),
            body: form
        });
        alert("Synced to Cloud!");
        listFiles();
    }

    async function listFiles() {
        const response = await gapi.client.drive.files.list({ fields: 'files(id, name)' });
        const listDiv = document.getElementById('file-list');
        listDiv.innerHTML = response.result.files.map(f => `
            <div class="file-item">
                <span>📄 ${f.name}</span>
            </div>
        `).join('');
    }

    function unlockVault() {
        // Fingerprint Logic Trigger
        if (window.PublicKeyCredential) {
            gsap.to("#vault-area", { filter: "blur(0px)", opacity: 1 });
            document.getElementById('biometric-btn').style.display = 'none';
        }
    }
</script>
</body>
</html>
